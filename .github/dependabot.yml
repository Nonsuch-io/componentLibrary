# Auto-merge behaviour (see .github/workflows/dependabot-auto-merge.yml):
# patch + minor updates are auto-approved and auto-merged once CI passes.
#
# NOTE: the "Protect main" ruleset requires 1 approving review on every PR. The
# workflow only auto-approves non-major updates, so **major bumps need a manual
# approval** (or an admin bypass) before they can merge — they will not
# auto-merge on their own by design.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Wait for community detection of compromised releases before opening PRs.
    # Security advisory PRs bypass this and are opened immediately.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@vue/test-utils'
          - happy-dom
      linting:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - prettier
          - typescript-eslint
      build:
        patterns:
          - vite
          - '@vitejs/*'
          - vue-tsc
          - typescript
          - sass-embedded
      vue:
        patterns:
          - vue
      quasar:
        patterns:
          - quasar
          - '@quasar/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
