version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Wait for community detection of compromised releases before opening PRs.
    # Security advisory PRs bypass this and are opened immediately.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@vue/test-utils'
          - happy-dom
      linting:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - prettier
          - typescript-eslint
      build:
        patterns:
          - vite
          - '@vitejs/*'
          - vue-tsc
          - typescript
          - sass-embedded
      vue:
        patterns:
          - vue
          - quasar
          - '@quasar/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
