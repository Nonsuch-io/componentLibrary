name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Exchange OIDC token for npm publish token
        run: |
          set -e

          echo "::group::Request OIDC token from GitHub"
          OIDC_RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://registry.npmjs.org")
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to get OIDC token from GitHub"
            echo "Response: $OIDC_RESPONSE"
            exit 1
          fi
          echo "Got OIDC token (${#OIDC_TOKEN} chars)"
          echo "::endgroup::"

          echo "::group::Exchange OIDC token for npm token"
          NPM_RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://registry.npmjs.org/-/npm/v1/security/oidc/token" \
            -H "Content-Type: application/json" \
            -d "{\"oidcToken\": \"$OIDC_TOKEN\"}")
          HTTP_CODE=$(echo "$NPM_RESPONSE" | tail -1)
          BODY=$(echo "$NPM_RESPONSE" | sed '$d')
          echo "npm OIDC endpoint returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::npm token exchange failed (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            exit 1
          fi
          NPM_TOKEN=$(echo "$BODY" | jq -r '.token')
          if [ -z "$NPM_TOKEN" ] || [ "$NPM_TOKEN" = "null" ]; then
            echo "::error::npm response did not contain a token"
            echo "Response keys: $(echo "$BODY" | jq -r 'keys[]')"
            exit 1
          fi
          echo "Got npm token (${#NPM_TOKEN} chars)"
          echo "::endgroup::"

          echo "::add-mask::$NPM_TOKEN"
          echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public --provenance
