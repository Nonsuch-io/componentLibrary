name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is NOT in the default type list
    # ([opened, synchronize, reopened]). Without it, the draft guard below would
    # skip CI while the PR is a draft AND still skip it when the PR is marked
    # ready, because leaving draft would fire no event this workflow listens for
    # — a ready PR with no checks at all, which reads as a working config.
    # Both halves are load-bearing. componentLibrary-x3w.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ci:
    name: Lint, Type-check, Test, Build
    # Drafts are work in progress; a full lint/typecheck/test/build/storybook/
    # coverage/size run on every push to one is wasted. `push` events carry no
    # pull_request context, so the event_name check comes first — without it,
    # `github.event.pull_request.draft` is null on pushes to main and the whole
    # expression is false, which would silently disable CI on the default branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Node, no DOM globals: the only environment that catches a bare
      # `Element`/`window` reference, which 500s a consumer's whole SSR site
      # while the DOM suites stay green (componentLibrary-2cp).
      - name: SSR tests
        run: pnpm test:ssr

      # Server-renders every exported component in plain node against the BUILT
      # bundle — the half `pnpm test:ssr` cannot reach, because Vitest always
      # loads quasar's client build (componentLibrary-zfw).
      - name: SSR component smoke
        run: pnpm test:ssr:components

      - name: Storybook tests
        run: pnpm test:storybook

      - name: Coverage
        run: pnpm test:coverage

      - name: Check bundle size
        run: pnpm size:check

  peer-floor:
    name: Peer floor (oldest quasar we promise)
    # A SEPARATE job on purpose: it installs a different quasar, so it cannot be
    # a step in the job above without poisoning everything after it.
    #
    # WHY IT EXISTS (componentLibrary-q5r). peerDependencies is a promise to
    # consumers; `pnpm install` resolves the NEWEST match, so the promise was
    # never exercised. `^2.17.0` stayed declared for months while nine
    # assertions failed on it (componentLibrary-u5v), and a fix for a bug that
    # only appears on older quasar could pass review green because CI resolved
    # a version where Quasar did the work itself (componentLibrary-5ng).
    #
    # The version is READ FROM package.json rather than written here, so the
    # gate cannot drift from the promise it is checking.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the declared floor
        id: floor
        run: echo "version=$(node scripts/peer-floor.mjs quasar)" >> "$GITHUB_OUTPUT"

      - name: Install the declared floor exactly
        # Through `env:` rather than interpolating `${{ }}` into the shell.
        # Safe today — floorOf can only return digits and dots — but that is an
        # invariant of another file, and a future edit loosening it (build
        # metadata, say) would silently turn this into shell injection.
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        # --save-exact so the resolved version IS the floor, not the newest
        # release matching it — the whole point of the job.
        run: pnpm add -D "quasar@$FLOOR" --save-exact

      - name: Confirm the floor is what got installed
        # Without this the job can silently test the wrong version and go green,
        # which is the failure mode it exists to prevent.
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: |
          installed=$(node -p "require('quasar/package.json').version")
          echo "installed quasar: $installed (declared floor: $FLOOR)"
          test "$installed" = "$FLOOR"

      # dist tests and the size gate read dist/, so build before testing.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: SSR tests
        run: pnpm test:ssr

      # The floor is where a consumer's server actually runs, so render there too.
      - name: SSR component smoke
        run: pnpm test:ssr:components
