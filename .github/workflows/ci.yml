name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is NOT in the default type list
    # ([opened, synchronize, reopened]). Without it, the draft guard below would
    # skip CI while the PR is a draft AND still skip it when the PR is marked
    # ready, because leaving draft would fire no event this workflow listens for
    # — a ready PR with no checks at all, which reads as a working config.
    # Both halves are load-bearing. componentLibrary-x3w.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ci:
    name: Lint, Type-check, Test, Build
    # Drafts are work in progress; a full lint/typecheck/test/build/storybook/
    # coverage/size run on every push to one is wasted. `push` events carry no
    # pull_request context, so the event_name check comes first — without it,
    # `github.event.pull_request.draft` is null on pushes to main and the whole
    # expression is false, which would silently disable CI on the default branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Storybook tests
        run: pnpm test:storybook

      - name: Coverage
        run: pnpm test:coverage

      - name: Check bundle size
        run: pnpm size:check
